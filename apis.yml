aid: looking-glass
name: Looking Glass
description: >-
  Looking Glass Factory builds light field (holographic) displays — group-viewable
  3D screens ranging from the pocket-sized Looking Glass Go to 16", 27", 32" and 65"
  panels — plus the software that drives them. For developers, the core surface is
  Looking Glass Bridge: a local runtime that exposes an HTTP REST API on
  http://localhost:33334/ for enumerating connected displays, opening the media
  player, building playlists of Quilt and RGBD holograms, and controlling playback.
  Around it Looking Glass ships official client libraries — the typesafe bridge.js
  (@lookingglass/bridge), a WebXR polyfill (@lookingglass/webxr) that targets the
  displays from any WebXR framework, a Python Bridge SDK, the legacy HoloPlay Core
  C/C++/C# SDK, and engine plugins for Unity, Unreal and Blender. Looking Glass
  Blocks (blocks.glass) hosts holograms on the internet. The company is backed by
  Uncork Capital and headquartered in Brooklyn, New York.
