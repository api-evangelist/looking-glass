openapi: 3.2.0
info:
  title: Looking Glass Bridge Orchestration API
  version: '1.0'
  description: HTTP REST API exposed by Looking Glass Bridge, the local runtime application that connects a host machine to Looking Glass holographic (light field) displays.
  contact:
    name: Looking Glass Factory
    url: https://lookingglassfactory.com
  x-generated-by: API Evangelist enrichment pipeline
  x-source:
  - https://docs.lookingglassfactory.com/software/looking-glass-bridge-sdk/web-application-integration
  - https://github.com/Looking-Glass/bridge.js
servers:
- url: http://localhost:33334/
  description: Looking Glass Bridge local loopback server (default port)
tags:
- name: Orchestration
  description: Multi-user Bridge sessions (orchestrations)
paths:
  /enter_orchestration:
    post:
      operationId: enter_orchestration
      summary: Start (or join) a Bridge orchestration session and receive an orchestration…
      tags:
      - Orchestration
      requestBody:
        $ref: '#/components/requestBodies/EnterOrchestration'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
  /exit_orchestration:
    post:
      operationId: exit_orchestration
      summary: Leave a Bridge orchestration session
      tags:
      - Orchestration
      requestBody:
        $ref: '#/components/requestBodies/Orchestrated'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
components:
  requestBodies:
    Orchestrated:
      description: Requires the orchestration token for the session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrchestrationRef'
    EnterOrchestration:
      description: Optional orchestration name/keyword to create or join a session.
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Keyword identifying the orchestration to create or join.
  schemas:
    OrchestrationRef:
      type: object
      properties:
        orchestration:
          type: string
          description: Orchestration token returned by enter_orchestration.
      required:
      - orchestration
    ResponseEnvelope:
      type: object
      description: Standard Bridge response envelope returned by every endpoint.
      properties:
        success:
          type: boolean
          description: Whether the operation succeeded.
        response:
          description: Operation payload when successful, otherwise null.
          type:
          - object
          - 'null'
      required:
      - success
  responses:
    Envelope:
      description: Standard Bridge response envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseEnvelope'
